name: Build Windows

on:
  workflow_dispatch:
  workflow_call:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Windows (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: x86_64
            msvc: x64
          - runner: windows-11-arm
            architecture: arm64
            msvc: arm64

    steps:
      - uses: actions/checkout@v5

      # The runner images carry no NSIS, which is the compiler the installer is built with.
      - name: Install build dependencies
        run: choco install ninja nsis --no-progress --yes

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/release/_deps
          key: deps-windows-${{ matrix.architecture }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}

      - name: Enable MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}

      - name: Configure
        run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DWORKPANE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/release --parallel

      - name: Run tests
        run: ctest --test-dir build/release --parallel 4 --output-on-failure --no-tests=error

      - name: Package
        run: cmake --build build/release --target package

      - name: Validate package
        run: python make.py validate-package

      - name: Collect package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem build/release -Filter "Workpane-*.exe" | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName dist/workpane-windows-${{ matrix.architecture }}-installer.exe }
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: workpane-windows-${{ matrix.architecture }}
          if-no-files-found: error
          path: dist/workpane-windows-${{ matrix.architecture }}-installer.exe
