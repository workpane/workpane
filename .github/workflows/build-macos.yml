name: Build macOS

on:
  workflow_dispatch:
  workflow_call:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: macOS (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: brew install ninja

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/release/_deps
          key: deps-macos-${{ matrix.architecture }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/patches/**') }}

      # A certificate in the secrets signs the bundle for distribution, and without one it is signed ad hoc, which is enough to run it locally.
      - name: Resolve signing configuration
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          NOTARIZATION_USERNAME: ${{ secrets.NOTARIZATION_USERNAME }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$SIGNING_IDENTITY" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$SIGNING_IDENTITY" ] && [ -n "$NOTARIZATION_USERNAME" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.sign == 'true'
        uses: apple-actions/import-codesign-certs@v7
        with:
          keychain: ${{ github.run_id }}
          keychain-password: ${{ github.run_id }}
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Configure
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          SIGNING_ENABLED: ${{ steps.signing.outputs.sign }}
        run: |
          identity="-"
          if [ "$SIGNING_ENABLED" = "true" ]; then
            identity="$SIGNING_IDENTITY"
          fi
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DWORKPANE_BUILD_TESTS=ON -DWORKPANE_CODESIGN_IDENTITY="$identity"

      - name: Build
        run: cmake --build build/release --parallel $(sysctl -n hw.ncpu)

      - name: Run tests
        run: ctest --test-dir build/release --parallel $(sysctl -n hw.ncpu) --output-on-failure --no-tests=error

      - name: Package
        run: cmake --build build/release --target package

      - name: Validate package
        run: python3 make.py validate-package

      - name: Collect package
        run: |
          mkdir -p dist
          find build/release -maxdepth 1 -name "Workpane-*.dmg" -exec cp {} dist/workpane-macos-${{ matrix.architecture }}.dmg \;
          ls -l dist

      - name: Notarize and staple
        if: steps.signing.outputs.notarize == 'true'
        env:
          NOTARIZATION_USERNAME: ${{ secrets.NOTARIZATION_USERNAME }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          xcrun notarytool submit dist/workpane-macos-${{ matrix.architecture }}.dmg --apple-id "$NOTARIZATION_USERNAME" --password "$NOTARIZATION_PASSWORD" --team-id "$NOTARIZATION_TEAM_ID" --wait
          xcrun stapler staple dist/workpane-macos-${{ matrix.architecture }}.dmg
          xcrun stapler validate dist/workpane-macos-${{ matrix.architecture }}.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: workpane-macos-${{ matrix.architecture }}
          if-no-files-found: error
          path: dist/workpane-macos-${{ matrix.architecture }}.dmg
